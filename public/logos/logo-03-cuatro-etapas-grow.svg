<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" fill="none">
  <!-- Concepto 3: Los 4 Peldaños GROW (Goal, Reality, Options, Will) formando una A -->
  <g transform="translate(24, 22)">
    <rect x="4" y="4" width="168" height="168" rx="28" stroke="#0A0A0A" stroke-width="5" fill="#FFFFFF"/>
    <!-- 4 barras ascendentes en escala monocromatica de tinta -->
    <!-- Etapa 1: G (Goal) -->
    <rect x="30" y="114" width="24" height="36" rx="5" fill="#737373"/>
    <!-- Etapa 2: R (Reality) -->
    <rect x="62" y="90" width="24" height="60" rx="5" fill="#404040"/>
    <!-- Etapa 3: O (Options) -->
    <rect x="94" y="64" width="24" height="86" rx="5" fill="#171717"/>
    <!-- Etapa 4: W (Will) -->
    <rect x="126" y="34" width="24" height="116" rx="5" fill="#0A0A0A"/>
    <!-- Arco/Flecha superior de ascenso -->
    <path d="M36 92C60 72 88 50 116 30" stroke="#0A0A0A" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M104 28H118V42" stroke="#0A0A0A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(222, 54)">
    <text x="0" y="64" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="68" font-weight="900" letter-spacing="-2" fill="#0A0A0A">AVANZA</text>
    <text x="4" y="98" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="3.2" fill="#171717">G·R·O·W — COACHING</text>
    <text x="4" y="118" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2" fill="#525252">IMPULSA TU MEJOR VERSIÓN</text>
  </g>
</svg>
