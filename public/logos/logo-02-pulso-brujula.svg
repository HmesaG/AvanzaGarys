<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" fill="none">
  <!-- Concepto 2: Pulso Vital + Brujula Ejecutiva (3 Lineas: Personal, Corporativo, Deportivo) -->
  <g transform="translate(24, 22)">
    <!-- Anillo exterior de precision con marcas de brujula -->
    <circle cx="88" cy="88" r="82" stroke="#0A0A0A" stroke-width="6" fill="#FFFFFF"/>
    <circle cx="88" cy="88" r="70" stroke="#0A0A0A" stroke-width="1.5" stroke-dasharray="4 6"/>
    <!-- Ticks cardinales -->
    <line x1="88" y1="6" x2="88" y2="20" stroke="#0A0A0A" stroke-width="4" stroke-linecap="round"/>
    <line x1="88" y1="156" x2="88" y2="170" stroke="#0A0A0A" stroke-width="4" stroke-linecap="round"/>
    <line x1="6" y1="88" x2="20" y2="88" stroke="#0A0A0A" stroke-width="4" stroke-linecap="round"/>
    <line x1="156" y1="88" x2="170" y2="88" stroke="#0A0A0A" stroke-width="4" stroke-linecap="round"/>
    <!-- Onda de pulso que forma una A central -->
    <path d="M28 96H56L72 52L94 126L114 38L130 96H148" stroke="#0A0A0A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Nodo cumbre -->
    <circle cx="114" cy="38" r="7" fill="#0A0A0A"/>
    <circle cx="114" cy="38" r="3" fill="#FFFFFF"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(222, 56)">
    <text x="0" y="62" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="66" font-weight="800" letter-spacing="-1.5" fill="#0A0A0A">AvanzA</text>
    <g transform="translate(2, 82)">
      <rect x="0" y="0" width="92" height="24" rx="12" fill="#0A0A0A"/>
      <text x="46" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" fill="#FFFFFF">PERSONAL</text>

      <rect x="100" y="0" width="118" height="24" rx="12" stroke="#0A0A0A" stroke-width="2" fill="none"/>
      <text x="159" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" fill="#0A0A0A">CORPORATIVO</text>

      <rect x="226" y="0" width="104" height="24" rx="12" stroke="#0A0A0A" stroke-width="2" fill="none"/>
      <text x="278" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" fill="#0A0A0A">DEPORTIVO</text>
    </g>
  </g>
</svg>

