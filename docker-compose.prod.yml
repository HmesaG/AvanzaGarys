# ========================================================
# Docker Compose para Producción - Plataforma AvanzA
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# ========================================================

services:
  # Base de Datos Relacional MariaDB
  mariadb:
    image: mariadb:11
    container_name: avanza-mariadb-prod
    restart: always
    environment:
      MARIADB_DATABASE: ${DB_NAME:-avanza_prod}
      MARIADB_USER: ${DB_USER:-avanza_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Error: DB_PASSWORD es obligatoria en produccion}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Error: DB_ROOT_PASSWORD es obligatoria en produccion}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --max-connections=200
    volumes:
      - avanza_prod_mariadb_data:/var/lib/mysql
    networks:
      - avanza-internal-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Motor de Caché en Memoria y Sesiones Redis
  redis:
    image: redis:7-alpine
    container_name: avanza-redis-prod
    restart: always
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes
        else
          redis-server --appendonly yes
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - avanza_prod_redis_data:/data
    networks:
      - avanza-internal-network
    healthcheck:
      test: >
        sh -c '
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG
          else
            redis-cli ping | grep PONG
          fi
        '
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Inicializador de Esquema de Base de Datos (corre una sola vez al desplegar)
  db-init:
    build:
      context: .
      target: builder
    container_name: avanza-db-init-prod
    environment:
      DATABASE_URL: "mysql://${DB_USER:-avanza_app}:${DB_PASSWORD}@mariadb:3306/${DB_NAME:-avanza_prod}"
    command: ["node", "./node_modules/prisma/build/index.js", "db", "push", "--skip-generate"]
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - avanza-internal-network
    restart: "no"

  # Aplicación Web Next.js (AvanzA)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avanza-app-prod
    restart: always
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: "mysql://${DB_USER:-avanza_app}:${DB_PASSWORD}@mariadb:3306/${DB_NAME:-avanza_prod}"
      REDIS_URL: >
        sh -c '
          if [ -n "${REDIS_PASSWORD}" ]; then
            echo "redis://:${REDIS_PASSWORD}@redis:6379"
          else
            echo "redis://redis:6379"
          fi
        '
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://avanza.example.com}
      # Integraciones de Notificaciones e IA
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-AvanzA Coaching <notificaciones@avanza.dev>}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PAYMENTS_WEBHOOK_SECRET: ${PAYMENTS_WEBHOOK_SECRET:-}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - avanza-internal-network

networks:
  avanza-internal-network:
    driver: bridge

volumes:
  avanza_prod_mariadb_data:
    name: avanza_prod_mariadb_data
  avanza_prod_redis_data:
    name: avanza_prod_redis_data
